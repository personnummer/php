name: PHP Composer

on:
  push:
    branches:
      - main

  # Run tests for any PRs.
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ['8.4']
        test-command: ['test']

    name: Test PHP ${{ matrix.php-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup PHP Action
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer:v2
      - name: Validate composer.json and composer.lock
        run: |
          composer --version
          composer validate
      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-suggest
      - name: Run test suite
        run: composer run-script ${{ matrix.test-command }}

  # Single stable check for branch protection, so the ruleset does not need
  # to change when the matrix does.
  tests-passed:
    if: always()
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any test job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
